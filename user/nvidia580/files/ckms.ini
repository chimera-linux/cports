[general]
name = nvidia
version = @VERSION@
strip = yes
initramfs = yes
[hooks]
build = ${MAKE} ${CKMS_MAKE_ARGS} NV_EXCLUDE_BUILD_MODULES='' KERNEL_UNAME=${CKMS_KERNEL_VERSION} modules -j${CKMS_JOBS}
[module.nvidia]
path = .
dest = kernel/drivers/video
[module.nvidia-drm]
path = .
dest = kernel/drivers/video
[module.nvidia-modeset]
path = .
dest = kernel/drivers/video
[module.nvidia-uvm]
path = .
dest = kernel/drivers/video
