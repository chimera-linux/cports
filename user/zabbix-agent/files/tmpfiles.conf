# Create zabbix runtime and log directories, and the directory for local
# configuration overrides (the agent fails if the include directory is missing)

d /run/zabbix 0755 _zabbix _zabbix -
d /var/log/zabbix 0750 _zabbix _zabbix -
d /etc/zabbix 0755 root root -
d /etc/zabbix/zabbix_agentd.d 0755 root root -
